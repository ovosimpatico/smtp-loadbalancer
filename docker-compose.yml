services:
  smtp-loadbalancer:
    container_name: smtp-loadbalancer
    image: ghcr.io/ovosimpatico/smtp-loadbalancer:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    volumes:
      - ./config.json:/app/config/config.json:ro
      # Logs
      - ./logs:/app/logs
      - ./data:/app/data
      # TLS certificates (uncomment if using server.tls)
      # - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/config/config.json
    ports:
      - "2525:2525"
      # Dashboard/API — bind to localhost only unless you need remote access.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
