<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTP Load Balancer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: hsl(222.2 84% 4.9%);
            --card: hsl(222.2 47% 7%);
            --border: hsl(217.2 32.6% 17.5%);
            --border-hover: hsl(217.2 32.6% 27.5%);
            --fg: hsl(210 40% 98%);
            --muted: hsl(215 20.2% 65.1%);
            --green: hsl(142.1 76.2% 41%);
            --red: hsl(0 84.2% 60.2%);
            --amber: hsl(38 92% 50%);
            --blue: hsl(217 91% 60%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 1500px; margin: 0 auto; }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.025em; }
        h1 .mode { font-size: 0.7rem; vertical-align: middle; }
        .subtitle { font-size: 0.8rem; color: var(--muted); }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.55rem;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 0.35rem;
            background-color: var(--border);
            color: var(--fg);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge.ok { background-color: hsl(142.1 70% 20%); color: var(--green); }
        .badge.warn { background-color: hsl(38 70% 18%); color: var(--amber); }
        .badge.bad { background-color: hsl(0 62% 22%); color: var(--red); }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .summary .tile {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            padding: 1rem 1.1rem;
        }
        .tile .tile-label {
            font-size: 0.68rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .tile .tile-value { font-size: 1.5rem; font-weight: 700; margin-top: 0.3rem; }
        .tile .tile-sub { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }

        .section-title {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 1.75rem 0 0.85rem;
        }

        .next-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .next-item {
            background-color: var(--border);
            padding: 0.5rem 0.8rem;
            border-radius: 0.4rem;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .next-item:first-child { background-color: var(--green); color: var(--bg); font-weight: 700; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.35rem;
            transition: border-color 0.2s ease;
        }
        .card:hover { border-color: var(--border-hover); }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .card-header .name { font-size: 0.95rem; font-weight: 600; }

        .chart-block { margin-bottom: 0.5rem; }
        .chart-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 500;
            margin-bottom: 0.35rem;
        }
        .chart-label .muted { color: var(--muted); font-weight: 400; }
        .bar-canvas { height: 10px !important; }
        .pie-wrap { height: 150px; position: relative; margin: 0.4rem 0; }

        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem 1rem;
            margin-top: 0.9rem;
            padding-top: 0.85rem;
            border-top: 1px solid var(--border);
        }
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.78rem;
        }
        .metric .m-label { color: var(--muted); }
        .metric .m-value { font-weight: 600; }
        .m-value.danger { color: var(--red); }
        .m-value.warn { color: var(--amber); }
        .m-value.good { color: var(--green); }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.72rem;
            margin-top: 2.5rem;
        }
        .loading { text-align: center; color: var(--muted); padding: 4rem; }
        .error {
            background-color: hsl(0 62.8% 22%);
            color: var(--fg);
            padding: 0.9rem 1rem;
            border-radius: 0.5rem;
            text-align: center;
            margin: 1rem 0;
            font-size: 0.85rem;
        }
        .card .error { margin: 0; }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>SMTP Load Balancer <span id="modeBadge" class="badge mode">—</span></h1>
            <div class="subtitle">Auto-refresh 30s · Updated <span id="lastUpdate">—</span></div>
        </header>

        <div id="loading" class="loading">Loading…</div>
        <div id="error" class="error" style="display:none;"></div>
        <div id="content" style="display:none;">
            <div id="summary" class="summary"></div>

            <div class="section-title">Next providers (send order)</div>
            <div id="next-list" class="next-list"></div>

            <div class="section-title">Providers</div>
            <div id="stats-grid" class="stats-grid"></div>
        </div>

        <div class="footer">SMTP Load Balancer · open-source AGPLv3</div>
    </div>

    <script>
        const charts = {};
        const COLOR = {
            used: 'hsl(217 91% 60%)',
            free: 'hsl(217.2 32.6% 20%)',
            green: 'hsl(142.1 76.2% 41%)',
            red: 'hsl(0 84.2% 60.2%)',
            amber: 'hsl(38 92% 50%)',
        };

        function safeId(name) { return name.replace(/[^a-zA-Z0-9]/g, '-'); }
        function num(n) { return (n || 0).toLocaleString(); }
        function pct(n) { return (n || 0).toFixed(1) + '%'; }

        async function fetchStats() {
            try {
                const res = await fetch('/stats', { headers: { 'Accept': 'application/json' } });
                if (!res.ok) throw new Error('Failed to fetch stats (' + res.status + ')');
                const data = await res.json();

                render(data);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                const e = document.getElementById('error');
                e.style.display = 'block';
                e.textContent = err.message;
            }
        }

        function render(data) {
            const mode = data.mode || 'generic';
            const modeBadge = document.getElementById('modeBadge');
            modeBadge.textContent = mode;
            modeBadge.className = 'badge mode ' + (mode === 'smtp2go' ? 'ok' : '');

            renderSummary(mode, data.providers || {}, data.queue || {});
            renderNext(data.next || []);
            renderProviders(mode, data.providers || {});
        }

        function renderSummary(mode, providers, queue) {
            const list = Object.values(providers);
            const tiles = [];
            const m = queue.metrics || {};

            if (mode === 'smtp2go') {
                const dailySent = list.reduce((a, p) => a + (p.daily_sent || 0), 0);
                const dailyCap = list.reduce((a, p) => a + (p.daily_limit || 0), 0);
                const dailyLeft = list.reduce((a, p) => a + (p.daily_remaining || 0), 0);
                const monthLeft = list.reduce((a, p) => a + (p.cycle_remaining || 0), 0);
                const hardB = list.reduce((a, p) => a + (p.hard_bounces || 0), 0);
                const softB = list.reduce((a, p) => a + (p.soft_bounces || 0), 0);
                const spam = list.reduce((a, p) => a + (p.spam_count || 0), 0);
                tiles.push(tile('Daily sent', num(dailySent), 'of ' + num(dailyCap) + ' capacity'));
                tiles.push(tile('Daily remaining', num(dailyLeft), 'across all accounts'));
                tiles.push(tile('Monthly remaining', num(monthLeft), 'cycle quota left'));
                tiles.push(tile('Bounces', num(hardB + softB), num(hardB) + ' hard · ' + num(softB) + ' soft'));
                tiles.push(tile('Spam reports', num(spam), 'flagged by SMTP2GO'));
            } else {
                const sent = list.reduce((a, p) => a + (p.sent || 0), 0);
                const errs = list.reduce((a, p) => a + (p.errors || 0), 0);
                tiles.push(tile('Total sent', num(sent), 'since start'));
                tiles.push(tile('Total errors', num(errs), 'delivery failures'));
            }

            tiles.push(tile('Queue', num(queue.length), num(queue.running) + ' delivering now'));
            tiles.push(tile('Delivered', num(m.delivered), num(m.retried) + ' retries'));
            const dl = queue.deadLetterCount || 0;
            tiles.push(tile('Dead-lettered', num(dl), 'undeliverable', dl > 0 ? 'bad' : null));

            document.getElementById('summary').innerHTML = tiles.join('');
        }

        function tile(label, value, sub, badgeClass) {
            const badge = badgeClass ? ' <span class="badge ' + badgeClass + '">!</span>' : '';
            return '<div class="tile"><div class="tile-label">' + label + '</div>' +
                '<div class="tile-value">' + value + badge + '</div>' +
                '<div class="tile-sub">' + (sub || '') + '</div></div>';
        }

        function renderNext(next) {
            const el = document.getElementById('next-list');
            if (!next.length) {
                el.innerHTML = '<div class="next-item">No provider currently available</div>';
                return;
            }
            el.innerHTML = next.map((n, i) =>
                '<div class="next-item">' + (i + 1) + '. ' + escapeHtml(n) + '</div>'
            ).join('');
        }

        function statusBadge(status) {
            const map = {
                'ok': ['ok', 'OK'],
                'cooldown': ['warn', 'Cooldown'],
                'rate-limited': ['warn', 'Rate limited'],
                'daily-exhausted': ['bad', 'Daily full'],
                'monthly-exhausted': ['bad', 'Monthly full'],
                'error': ['bad', 'Error'],
            };
            const [cls, text] = map[status] || ['', status || 'unknown'];
            return '<span class="badge ' + cls + '">' + text + '</span>';
        }

        function renderProviders(mode, providers) {
            const grid = document.getElementById('stats-grid');
            const seen = new Set();

            Object.entries(providers).forEach(([name, data]) => {
                const id = 'card-' + safeId(name);
                seen.add(id);
                let card = document.getElementById(id);
                if (!card) {
                    card = document.createElement('div');
                    card.id = id;
                    card.className = 'card';
                    grid.appendChild(card);
                }
                if (data.type === 'smtp2go') renderSmtp2go(card, name, data);
                else renderGeneric(card, name, data);
            });

            // Remove cards for providers no longer present.
            [...grid.children].forEach((c) => { if (!seen.has(c.id)) c.remove(); });
        }

        function renderGeneric(card, name, data) {
            const cid = 'chart-' + safeId(name);
            card.innerHTML =
                '<div class="card-header"><span class="name">' + escapeHtml(name) + '</span>' +
                '<span class="badge ok">generic</span></div>' +
                '<div class="pie-wrap"><canvas id="' + cid + '"></canvas></div>' +
                '<div class="metric-grid">' +
                metric('Sent', num(data.sent), 'good') +
                metric('Errors', num(data.errors), data.errors > 0 ? 'danger' : '') +
                '</div>';
            destroy(cid);
            charts[cid] = new Chart(document.getElementById(cid), {
                type: 'doughnut',
                data: {
                    labels: ['Sent', 'Errors'],
                    datasets: [{
                        data: [data.sent || 0, data.errors || 0],
                        backgroundColor: [COLOR.green, COLOR.red],
                        borderWidth: 0,
                    }],
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
            });
        }

        function renderSmtp2go(card, name, data) {
            const cid = 'chart-' + safeId(name);
            const dailyId = cid + '-daily';
            const monthlyId = cid + '-monthly';

            if (data.status === 'error') {
                card.innerHTML =
                    '<div class="card-header"><span class="name">' + escapeHtml(name) + '</span>' +
                    statusBadge('error') + '</div>' +
                    '<div class="error">' + escapeHtml(data.error || 'Unknown error') + '</div>';
                destroy(dailyId); destroy(monthlyId);
                return;
            }

            const dailyUsed = data.daily_sent || 0;
            const dailyRem = data.daily_remaining || 0;
            const monthUsed = data.cycle_used || 0;
            const monthRem = data.cycle_remaining || 0;
            const bounceClass = (data.bounce_percent > 5) ? 'danger' : (data.bounce_percent > 1 ? 'warn' : '');
            const spamClass = (data.spam_percent > 0.1) ? 'danger' : '';

            card.innerHTML =
                '<div class="card-header"><span class="name">' + escapeHtml(name) + '</span>' +
                statusBadge(data.status) + '</div>' +

                '<div class="chart-block">' +
                '<div class="chart-label"><span>Daily usage</span>' +
                '<span class="muted">' + num(dailyUsed) + ' / ' + num(data.daily_limit) + '</span></div>' +
                '<canvas id="' + dailyId + '" class="bar-canvas"></canvas></div>' +

                '<div class="chart-block">' +
                '<div class="chart-label"><span>Monthly cycle</span>' +
                '<span class="muted">' + num(monthUsed) + ' / ' + num(data.cycle_max) + '</span></div>' +
                '<div class="pie-wrap"><canvas id="' + monthlyId + '"></canvas></div></div>' +

                '<div class="metric-grid">' +
                metric('Daily remaining', num(dailyRem)) +
                metric('Monthly remaining', num(monthRem)) +
                metric('Total emails', num(data.total_emails)) +
                metric('In flight', num(data.in_flight)) +
                metric('Hard bounces', num(data.hard_bounces), data.hard_bounces > 0 ? 'danger' : '') +
                metric('Soft bounces', num(data.soft_bounces), data.soft_bounces > 0 ? 'warn' : '') +
                metric('Bounce rate', pct(data.bounce_percent), bounceClass) +
                metric('Spam rate', pct(data.spam_percent), spamClass) +
                (data.cooldown_until
                    ? metric('Cooldown until', new Date(data.cooldown_until).toLocaleTimeString(), 'warn')
                    : '') +
                '</div>';

            destroy(dailyId);
            charts[dailyId] = new Chart(document.getElementById(dailyId), {
                type: 'bar',
                data: {
                    labels: ['Daily'],
                    datasets: [
                        { label: 'Used', data: [dailyUsed], backgroundColor: COLOR.used, borderWidth: 0 },
                        { label: 'Remaining', data: [dailyRem], backgroundColor: COLOR.free, borderWidth: 0 },
                    ],
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    scales: { x: { stacked: true, display: false }, y: { stacked: true, display: false } },
                    plugins: { legend: { display: false } },
                },
            });

            destroy(monthlyId);
            charts[monthlyId] = new Chart(document.getElementById(monthlyId), {
                type: 'doughnut',
                data: {
                    labels: ['Used', 'Remaining'],
                    datasets: [{
                        data: [monthUsed, monthRem],
                        backgroundColor: [COLOR.used, COLOR.green],
                        borderWidth: 0,
                    }],
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
            });
        }

        function metric(label, value, cls) {
            return '<div class="metric"><span class="m-label">' + label + '</span>' +
                '<span class="m-value ' + (cls || '') + '">' + value + '</span></div>';
        }

        function destroy(id) {
            if (charts[id]) { charts[id].destroy(); delete charts[id]; }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        fetchStats();
        setInterval(fetchStats, 30000);
    </script>
</body>

</html>
