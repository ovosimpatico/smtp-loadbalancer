<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTP Load Balancer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background-color: hsl(222.2 84% 4.9%);
            color: hsl(210 40% 98%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: hsl(215 20.2% 65.1%);
        }


        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, 360px);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: hsl(222.2 84% 4.9%);
            border: 1px solid hsl(217.2 32.6% 17.5%);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: hsl(217.2 32.6% 27.5%);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: hsl(210 40% 98%);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chart-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .chart-section {
            position: relative;
        }

        .daily-section {
            order: 1;
        }

        .monthly-section {
            order: 2;
        }

        .chart-bar {
            height: 8px !important;
            border-radius: 9999px;
            overflow: hidden;
        }

        .chart-pie {
            height: 160px !important;
        }

        .chart-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: hsl(210 40% 98%);
            margin-bottom: 0.5rem;
        }

        .chart-sublabel {
            font-size: 0.625rem;
            color: hsl(215 20.2% 65.1%);
            font-weight: 400;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid hsl(217.2 32.6% 17.5%);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 0.75rem;
            color: hsl(215 20.2% 65.1%);
            font-weight: 500;
        }

        .info-value {
            font-size: 0.875rem;
            color: hsl(210 40% 98%);
            font-weight: 600;
        }

        .footer {
            text-align: center;
            color: hsl(215 20.2% 65.1%);
            font-size: 0.75rem;
            margin-top: 2rem;
        }

        .loading {
            text-align: center;
            color: hsl(215 20.2% 65.1%);
            padding: 3rem;
        }

        .error {
            background-color: hsl(0 62.8% 30.6%);
            color: hsl(210 40% 98%);
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            margin: 1rem 0;
            font-size: 0.875rem;
        }

        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 0.25rem;
            background-color: hsl(217.2 32.6% 17.5%);
            color: hsl(210 40% 98%);
            margin-left: 0.5rem;
        }

        .next-section {
            background-color: hsl(222.2 84% 4.9%);
            border: 1px solid hsl(217.2 32.6% 17.5%);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .next-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: hsl(210 40% 98%);
        }

        .next-list {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .next-item {
            background-color: hsl(217.2 32.6% 17.5%);
            padding: 0.75rem;
            /* Changed padding */
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: hsl(210 40% 98%);
            transition: background-color 0.2s;
            /* Added transition */
        }

        .next-item:hover {
            /* Added hover effect */
            background-color: hsl(217.2 32.6% 20%);
        }

        .next-item:first-child {
            background-color: hsl(142.1 76.2% 36.3%);
            color: hsl(222.2 84% 4.9%);
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="loading" class="loading">Loading...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="next-section" class="next-section" style="display: none;">
            <div class="next-title">Next 5 Providers (Send Order)</div>
            <div id="next-list" class="next-list"></div>
        </div>

        <div id="stats-grid" class="stats-grid"></div>

        <div class="footer">
            Auto-refresh: 30s • Last update: <span id="lastUpdate">-</span>
        </div>
    </div>

    <script>
        const charts = {};

        async function fetchStats() {
            try {
                const response = await fetch('/stats');
                if (!response.ok) throw new Error('Failed to fetch stats');
                const data = await response.json();

                // Handle new response format
                const stats = data.providers || data; // Backwards compatible
                const nextProviders = data.next || [];

                displayStats(stats);
                displayNextProviders(nextProviders);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = error.message;
            }
        }

        function displayNextProviders(nextProviders) {
            const section = document.getElementById('next-section');
            const list = document.getElementById('next-list');

            if (!nextProviders || nextProviders.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = nextProviders.map((provider, index) =>
                `<div class="next-item">${index + 1}. ${provider}</div>`
            ).join('');
        }

        function displayStats(stats) {
            const grid = document.getElementById('stats-grid');

            Object.entries(stats).forEach(([name, data]) => {
                let cardId = 'card-' + name.replace(/[^a-zA-Z0-9]/g, '-');
                let card = document.getElementById(cardId);

                if (!card) {
                    card = document.createElement('div');
                    card.id = cardId;
                    card.className = 'card';
                    grid.appendChild(card);
                }

                if (data.error) {
                    card.innerHTML = `
                        <div class="card-header">${name}</div>
                        <div class="error">Error: ${data.error}</div>
                    `;
                    return;
                }

                if (data.type === 'generic') {
                    renderGenericCard(card, name, data);
                } else if (data.type === 'smtp2go') {
                    renderSmtp2goCard(card, name, data);
                }
            });
        }

        function renderGenericCard(card, name, data) {
            const chartId = 'chart-' + name.replace(/[^a-zA-Z0-9]/g, '-');

            card.innerHTML = `
                <div class="card-header">${name}<span class="badge">generic</span></div>
                <div class="chart-container">
                    <canvas id="${chartId}"></canvas>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Sent</div>
                        <div class="info-value">${data.sent || 0}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Errors</div>
                        <div class="info-value">${data.errors || 0}</div>
                    </div>
                </div>
            `;

            const ctx = document.getElementById(chartId);
            if (charts[chartId]) {
                charts[chartId].destroy();
            }

            charts[chartId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Sent', 'Errors'],
                    datasets: [{
                        data: [data.sent || 0, data.errors || 0],
                        backgroundColor: ['hsl(142.1 76.2% 36.3%)', 'hsl(0 84.2% 60.2%)'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function renderSmtp2goCard(card, name, data) {
            const chartId = 'chart-' + name.replace(/[^a-zA-Z0-9]/g, '-');

            const monthlyPercent = data.cycle_percent ? data.cycle_percent.toFixed(1) : '0.0';
            const dailyPercent = data.daily_percent ? data.daily_percent.toFixed(1) : '0.0';

            card.innerHTML = `
                <div class="card-header">
                    <span>${name}</span>
                    <span class="badge">smtp2go</span>
                </div>
                <div class="chart-container">
                    <div class="chart-section daily-section">
                        <div class="chart-label">
                            Daily Usage <span class="chart-sublabel">${data.daily_sent || 0} / ${data.daily_limit || 200}</span>
                        </div>
                        <canvas id="${chartId}-daily" class="chart-bar"></canvas>
                    </div>
                    <div class="chart-section monthly-section">
                        <div class="chart-label">
                            Monthly Usage <span class="chart-sublabel">${data.cycle_used || 0} / ${data.cycle_max || 0}</span>
                        </div>
                        <canvas id="${chartId}-monthly" class="chart-pie"></canvas>
                    </div>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Daily Remaining</span>
                        <span class="info-value">${data.daily_remaining || 0}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Monthly Remaining</span>
                        <span class="info-value">${data.cycle_remaining || 0}</span>
                    </div>
                </div>
            `;

            // Clean up old charts
            const dailyChartId = `${chartId}-daily`;
            const monthlyChartId = `${chartId}-monthly`;

            if (charts[dailyChartId]) charts[dailyChartId].destroy();
            if (charts[monthlyChartId]) charts[monthlyChartId].destroy();

            const dailyUsed = data.daily_sent || 0;
            const dailyRemaining = data.daily_remaining || 0;
            const monthlyUsed = data.cycle_used || 0;
            const monthlyRemaining = data.cycle_remaining || 0;

            // Daily Bar Chart
            const dailyCtx = document.getElementById(dailyChartId);
            charts[dailyChartId] = new Chart(dailyCtx, {
                type: 'bar',
                data: {
                    labels: ['Daily'],
                    datasets: [
                        {
                            label: 'Used',
                            data: [dailyUsed],
                            backgroundColor: 'hsl(0 84.2% 60.2%)',
                            borderWidth: 0
                        },
                        {
                            label: 'Remaining',
                            data: [dailyRemaining],
                            backgroundColor: 'hsl(142.1 76.2% 36.3%)',
                            borderWidth: 0
                        }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            stacked: true,
                            display: false
                        },
                        y: {
                            stacked: true,
                            display: false
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: true
                        }
                    }
                }
            });

            // Monthly Pie Chart
            const monthlyCtx = document.getElementById(monthlyChartId);
            charts[monthlyChartId] = new Chart(monthlyCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Used', 'Remaining'],
                    datasets: [{
                        data: [monthlyUsed, monthlyRemaining],
                        backgroundColor: ['hsl(0 84.2% 60.2%)', 'hsl(142.1 76.2% 36.3%)'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 1,
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        fetchStats();
        setInterval(fetchStats, 30000);
    </script>
</body>

</html>
